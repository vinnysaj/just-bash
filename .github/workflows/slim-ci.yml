name: Slim CI

# Gates the @vinnysaj/just-bash packages: the suites upstream's CI runs (unit,
# WASM, comparison) against core plus every add-on and against core alone,
# the differential test against the published upstream release, the app
# smoke test, and the size report.

on:
  push:
    branches: [slim]
  pull_request:
    branches: [slim]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # The oldest supported Node and the one Convex runs.
        node-version: ["22.13.0", "24"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The build reads the upstream base from the merged just-bash tags.
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      # node-liblzma compiles during install.
      - name: Install XZ build dependency
        run: sudo apt-get update && sudo apt-get install --yes liblzma-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Some upstream tests read upstream's own build output.
      - name: Build upstream package
        run: pnpm --filter just-bash build

      - name: Build slim packages
        run: pnpm --filter just-bash-slim build

      - name: Upstream unit suite, core and every add-on
        run: pnpm --filter just-bash-slim test:full

      - name: Upstream WASM suite, core and every add-on
        run: pnpm --filter just-bash-slim test:full:wasm

      - name: Upstream comparison suite, core and every add-on
        run: pnpm --filter just-bash-slim test:full:comparison

      - name: Upstream unit and comparison suites, core only
        run: pnpm --filter just-bash-slim test:core

      - name: Differential test against upstream
        run: pnpm --filter just-bash-slim test:diff

      - name: App smoke test
        run: pnpm --filter just-bash-slim test:smoke

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter just-bash typecheck && pnpm --filter just-bash-slim typecheck

  size:
    # Convex installs on Linux arm64, with install scripts.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The build reads the upstream base from the merged just-bash tags.
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install XZ build dependency
        run: sudo apt-get update && sudo apt-get install --yes liblzma-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build slim packages
        run: pnpm --filter just-bash-slim build

      - name: Size report
        run: pnpm --filter just-bash-slim size >> "$GITHUB_STEP_SUMMARY"
